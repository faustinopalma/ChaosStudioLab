<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title description">
  <title id="title">Private AKS and PostgreSQL native Chaos laboratory</title>
  <desc id="description">One private runner accesses an internal load balancer serving six Linux pods on six distinct worker nodes across three observed physical zones. Three system nodes span the same zones. PostgreSQL uses private zone-redundant HA; private HA Azure Managed Redis shares SQL-confirmed immutable reads across workers. Native Chaos Actions shut down exact tenant node scale sets or the selected-zone nodes and force PostgreSQL failover. Regional managed dependencies remain running. Direct private SQL snapshots verify every acknowledged write independently of both cache layers.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #000000; }
      .heading { font-size: 28px; font-weight: 600; }
      .label { font-size: 17px; font-weight: 600; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .network { fill: none; stroke: #0078d4; stroke-width: 2; }
      .subnet { fill: none; stroke: #5c2d91; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .zone { fill: none; stroke: #0078d4; stroke-width: 1.5; }
      .compute { fill: #cfe4fa; stroke: #0078d4; stroke-width: 1.5; }
      .neutral { fill: #f3f2f1; stroke: #495057; stroke-width: 1.5; }
      .identity { fill: #dff6dd; stroke: #107c10; stroke-width: 1.5; }
      .endpoint { fill: #e8daef; stroke: #5c2d91; stroke-width: 1.5; }
      .control { fill: #fff4ce; stroke: #f7630c; stroke-width: 1.5; }
      .dataflow { fill: none; stroke: #0078d4; stroke-width: 2; marker-end: url(#data-arrow); }
      .management { fill: none; stroke: #5c2d91; stroke-width: 2; stroke-dasharray: 7 4; marker-end: url(#management-arrow); }
      .fault { fill: none; stroke: #f7630c; stroke-width: 2; stroke-dasharray: 7 4; marker-end: url(#fault-arrow); }
    </style>
    <marker id="data-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0078d4"/></marker>
    <marker id="management-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5c2d91"/></marker>
    <marker id="fault-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f7630c"/></marker>
  </defs>
  <rect width="1400" height="1400" fill="#ffffff"/>
  <g inkscape:groupmode="layer" inkscape:label="Title and management" id="management-context">
    <text x="40" y="48" class="heading">Private AKS: six workers, three observed physical zones</text>
    <text x="40" y="78" class="body">Sweden Central | Azure Linux | fixed node pools | private HTTPS application and private PostgreSQL HA</text>
    <rect x="40" y="110" width="260" height="90" rx="8" class="neutral"/>
    <text x="60" y="141" class="label">Operator PC</text>
    <text x="60" y="167" class="body">Approved CLI profile</text>
    <text x="60" y="187" class="small">Visible, bounded foreground stages</text>
    <rect x="430" y="110" width="930" height="90" rx="8" class="control"/>
    <text x="450" y="141" class="label">Modern Chaos Workspace / Scenarios / native Actions</text>
    <text x="450" y="168" class="body">Exact one-node VMSS shutdown | selected-zone VMSS shutdown | forced PostgreSQL failover</text>
    <text x="450" y="188" class="small">Exact owned scopes and VM IDs; independent power-state, caller-identity and database-role evidence</text>
    <path d="M300 150 H430" class="management"/>
    <path d="M170 200 H25 V340 H65" class="management"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Private networks" id="private-networks">
    <rect x="40" y="250" width="320" height="370" rx="10" class="network"/>
    <text x="60" y="281" class="label">Operations VNet 10.94.0.0/16</text>
    <rect x="65" y="305" width="270" height="70" rx="6" class="neutral"/>
    <text x="85" y="333" class="label">Bastion management path</text>
    <text x="85" y="358" class="body">AzureBastionSubnet 10.94.2.0/26</text>
    <rect x="65" y="405" width="270" height="90" rx="6" class="compute"/>
    <text x="85" y="434" class="label">One private runner</text>
    <text x="85" y="458" class="body">Runner subnet 10.94.1.0/24</text>
    <text x="85" y="482" class="small">Load, observations and direct SQL verification</text>
    <path d="M200 375 V405" class="management"/>
    <rect x="65" y="535" width="270" height="55" rx="6" class="neutral"/>
    <text x="85" y="558" class="body">Controlled NAT egress</text>
    <text x="85" y="579" class="small">Runner has no public IP</text>
    <rect x="430" y="250" width="930" height="710" rx="10" class="network"/>
    <text x="450" y="281" class="label">Workload VNet 10.91.0.0/16</text>
    <rect x="460" y="310" width="330" height="70" rx="6" class="compute"/>
    <text x="480" y="337" class="label">Private internal load balancer</text>
    <text x="480" y="360" class="body">api.csl.internal / 10.91.3.240 / TLS 443</text>
    <rect x="820" y="310" width="260" height="70" rx="6" class="endpoint"/>
    <text x="840" y="337" class="label">Private AKS API</text>
    <text x="840" y="360" class="body">Entra RBAC; local admin disabled</text>
    <rect x="1110" y="310" width="220" height="70" rx="6" class="neutral"/>
    <text x="1130" y="337" class="label">Node NAT egress</text>
    <text x="1130" y="360" class="body">Nodes have no public IP</text>
    <path d="M335 450 H400 V345 H460" class="dataflow"/>
    <path d="M335 482 H410 V865 H480" class="dataflow"/>
    <text x="45" y="665" class="body">Bidirectional VNet peering</text>
    <text x="45" y="688" class="body">Private DNS linked to the runner</text>
    <path d="M335 422 H385 V225 H950 V310" class="management"/>
    <text x="1000" y="236" class="small">Private Kubernetes management</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Zonal nodes and pods" id="zonal-compute">
    <rect x="460" y="410" width="870" height="360" rx="8" class="subnet"/>
    <text x="480" y="437" class="label">Node subnet 10.91.0.0/22 | pod overlay 10.92.0.0/16</text>
    <text x="480" y="460" class="body">Local routing / 5 s probes / distinct workers | HTTP/1.1 + local/shared confirmed reads</text>
    <g id="zone-1">
      <rect x="480" y="480" width="260" height="270" rx="6" class="zone"/>
      <text x="495" y="508" class="label">Observed physical AZ 1</text>
      <rect x="495" y="525" width="230" height="45" rx="5" class="neutral"/>
      <text x="510" y="553" class="body">System pool: one node</text>
      <rect x="495" y="590" width="230" height="60" rx="5" class="compute"/>
      <text x="510" y="616" class="label">z1a: one worker / one pod</text>
      <text x="510" y="638" class="small">Private HTTPS 8443</text>
      <rect x="495" y="670" width="230" height="60" rx="5" class="compute"/>
      <text x="510" y="696" class="label">z1b: one worker / one pod</text>
      <text x="510" y="718" class="small">Private HTTPS 8443</text>
    </g>
    <g id="zone-2">
      <rect x="765" y="480" width="260" height="270" rx="6" class="zone"/>
      <text x="780" y="508" class="label">Observed physical AZ 2</text>
      <rect x="780" y="525" width="230" height="45" rx="5" class="neutral"/>
      <text x="795" y="553" class="body">System pool: one node</text>
      <rect x="780" y="590" width="230" height="60" rx="5" class="compute"/>
      <text x="795" y="616" class="label">z2a: one worker / one pod</text>
      <text x="795" y="638" class="small">Private HTTPS 8443</text>
      <rect x="780" y="670" width="230" height="60" rx="5" class="compute"/>
      <text x="795" y="696" class="label">z2b: one worker / one pod</text>
      <text x="795" y="718" class="small">Private HTTPS 8443</text>
    </g>
    <g id="zone-3">
      <rect x="1050" y="480" width="260" height="270" rx="6" class="zone"/>
      <text x="1065" y="508" class="label">Observed physical AZ 3</text>
      <rect x="1065" y="525" width="230" height="45" rx="5" class="neutral"/>
      <text x="1080" y="553" class="body">System pool: one node</text>
      <rect x="1065" y="590" width="230" height="60" rx="5" class="compute"/>
      <text x="1080" y="616" class="label">z3a: one worker / one pod</text>
      <text x="1080" y="638" class="small">Private HTTPS 8443</text>
      <rect x="1065" y="670" width="230" height="60" rx="5" class="compute"/>
      <text x="1080" y="696" class="label">z3b: one worker / one pod</text>
      <text x="1080" y="718" class="small">Private HTTPS 8443</text>
    </g>
    <path d="M625 380 V410" class="dataflow"/>
    <path d="M610 200 V215 H415 V510 H480" class="fault"/>
    <text x="45" y="733" class="body">Zone-compute fault targets</text>
    <text x="45" y="757" class="body">all three AZ-1 node VMs.</text>
    <text x="45" y="793" class="body">Four surviving application pods</text>
    <text x="45" y="817" class="body">serve the bounded workload.</text>
    <text x="45" y="853" class="body">Two replicas remain Pending</text>
    <text x="45" y="877" class="body">until their workers return.</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Private managed dependencies" id="managed-dependencies">
    <rect x="460" y="805" width="870" height="150" rx="8" class="subnet"/>
    <text x="480" y="831" class="label">Separate private-endpoint subnet 10.91.10.0/24</text>
    <rect x="480" y="845" width="250" height="40" rx="5" class="endpoint"/>
    <text x="500" y="871" class="body">PostgreSQL private endpoint</text>
    <rect x="765" y="845" width="250" height="40" rx="5" class="endpoint"/>
    <text x="785" y="871" class="body">Registry private endpoint</text>
    <rect x="1050" y="845" width="250" height="40" rx="5" class="endpoint"/>
    <text x="1070" y="871" class="body">Key Vault private endpoint</text>
    <rect x="480" y="910" width="250" height="40" rx="5" class="endpoint"/>
    <text x="500" y="936" class="body">Managed Redis private endpoint</text>
    <path d="M895 770 V780 H445 V865 H480" class="dataflow"/>
    <path d="M445 865 V930 H480" class="dataflow"/>
    <text x="665" y="799" class="small">Workload Identity / Entra / VerifyFull TLS</text>
    <rect x="480" y="965" width="250" height="95" rx="6" class="identity"/>
    <text x="500" y="993" class="label">PostgreSQL 16</text>
    <text x="500" y="1018" class="body">Zone-redundant HA, two zones</text>
    <text x="500" y="1042" class="small">Primary/standby roles swap on failover</text>
    <rect x="765" y="965" width="250" height="95" rx="6" class="identity"/>
    <text x="785" y="993" class="label">Private Premium ACR</text>
    <text x="785" y="1018" class="body">One digest-pinned Linux image</text>
    <text x="785" y="1042" class="small">Admin/public access disabled</text>
    <rect x="1050" y="965" width="250" height="95" rx="6" class="identity"/>
    <text x="1070" y="993" class="label">Private Key Vault</text>
    <text x="1070" y="1018" class="body">RBAC-protected diagnostics secret</text>
    <text x="1070" y="1042" class="small">Public data-plane access disabled</text>
    <path d="M605 885 V965" class="dataflow"/>
    <path d="M890 885 V965" class="dataflow"/>
    <path d="M1175 885 V965" class="dataflow"/>
    <text x="480" y="1100" class="body">Managed services use private DNS and endpoints; application/database public data-plane access is disabled.</text>
    <rect x="40" y="945" width="320" height="135" rx="6" class="identity"/>
    <text x="60" y="975" class="label">Private HA Azure Managed Redis</text>
    <text x="60" y="1001" class="body">Shared SQL-confirmed immutable reads</text>
    <text x="60" y="1027" class="small">Entra Workload Identity / TLS 10000</text>
    <text x="60" y="1050" class="small">Public access and access-key auth disabled;</text>
    <text x="60" y="1068" class="small">SQL commits and direct retention stay separate.</text>
    <path d="M480 930 H400 V1010 H360" class="dataflow"/>
    <rect x="40" y="1115" width="320" height="135" rx="6" class="control"/>
    <text x="60" y="1145" class="label">Governance-managed telemetry</text>
    <text x="60" y="1171" class="body">Defender default workspace</text>
    <text x="60" y="1197" class="small">Public ingestion/query remain enabled.</text>
    <text x="60" y="1220" class="small">Provider-created in an existing default group;</text>
    <text x="60" y="1238" class="small">outside the four owned laboratory groups.</text>
    <path d="M460 740 H380 V1180 H360" class="fault"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Measurement boundary" id="measurement-boundary">
    <rect x="40" y="1290" width="1320" height="85" rx="8" class="control"/>
    <text x="60" y="1320" class="label">Evidence boundary</text>
    <text x="60" y="1345" class="body">Native faults cover tenant AKS node shutdowns and PostgreSQL role failover. Managed regional dependencies remain running.</text>
    <text x="60" y="1367" class="small">Every acknowledged write is reconciled directly in SQL. Combined overlap is independently observed.</text>
  </g>
</svg>

    <text x="75" y="195">Approved CLI / authorized stages</text>
    <text x="75" y="220" class="small">Visible logs; lab retained after tests</text>
    <text x="75" y="325" class="heading">Modern Chaos Studio</text>
    <text x="75" y="355">Workspace: Sweden Central</text>
    <text x="75" y="385" class="small">Native process crash + DB failover</text>
    <text x="75" y="415" class="small">Exact owned targets; requested suite</text>
    <text x="500" y="170" class="heading">Managed Web App / Premium plan - six fixed workers (Linux baseline, Windows variant)</text>
    <text x="500" y="195" class="small">Actual plan: zoneRedundant=true, maximumNumberOfZones &gt;= 3, perSiteScaling=false</text>
    <text x="520" y="245">spaincentral-az1</text><text x="870" y="245">spaincentral-az2</text><text x="1220" y="245">spaincentral-az3</text>
    <text x="540" y="312">worker 1</text><text x="695" y="312">worker 2</text><text x="890" y="312">worker 3</text><text x="1045" y="312">worker 4</text><text x="1240" y="312">worker 5</text><text x="1395" y="312">worker 6</text>
    <text x="500" y="400" class="small">Observed: two workers per physical zone; every worker served healthy and checksum-verified business requests.</text>
    <text x="500" y="430" class="small">Private app + SCM; public access disabled; lab .NET 9 (support ends 10 Nov); checksummed package.</text>
    <text x="75" y="560" class="heading">Operations: Sweden Central</text>
    <text x="95" y="625" class="heading">One private runner</text><text x="95" y="655">Bastion SSH + NAT egress</text><text x="95" y="685" class="small">Bounded load / private publication</text>
    <text x="500" y="560" class="heading">Workload VNet - dedicated, separate subnets</text>
    <text x="525" y="625" class="heading">Outbound VNet Integration</text>
    <text x="525" y="655">Microsoft.Web/serverFarms delegation</text>

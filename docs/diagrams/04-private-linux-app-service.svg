<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1600" height="1080" viewBox="0 0 1600 1080">
  <title>Private App Service resilience lab - deployed architecture</title>
  <desc>Spain Central workload: all six workers served actual health and checksum-verified business traffic in three physical zones. Separate outbound Integration and inbound Private Endpoint subnets and private PostgreSQL HA. One private runner and operations VNet/NAT/Bastion remain in Sweden Central with global VNet peering. Linux App Service rejects native process deletion, so an explicit Windows comparison variant with the same plan shape, private paths and database runs the process-crash tests. On 6 November 2026 the Windows variant passed baseline, exact-instance, zone-selected, database and combined recovery and durability; full-phase database availability failed separately. Observed primary/standby are zones 2/1. Runtime support ends 10 November 2026.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0078d4"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#107c10"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5c2d91"/></marker>
    <style>text { font-family: Segoe UI, sans-serif; fill: #000; font-size: 19px } .title { font-size: 32px; font-weight: 600 } .heading { font-size: 23px; font-weight: 600 } .small { font-size: 17px } .boundary { fill: none; stroke: #0078d4; stroke-width: 2 } .node { fill: #cfe4fa; stroke: #0078d4; stroke-width: 2 } .data { fill: #dff6dd; stroke: #107c10; stroke-width: 2 }</style>

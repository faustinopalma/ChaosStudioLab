    <text x="1025" y="685" class="small">PostgreSQL / Key Vault / Azure Monitor</text>
    <text x="500" y="755" class="small">Private DNS linked to both VNets; direct bidirectional peering; platform DNS.</text>
    <text x="500" y="830" class="small">Blue: private ingress / SCM     Green: application data path     Purple dashed: native control-plane fault targeting</text>
    <text x="500" y="895" class="heading">Private PostgreSQL Flexible Server - public data plane disabled</text>
    <text x="525" y="955">Observed primary - zone 2</text><text x="1075" y="955">Observed HA standby - zone 1</text>
    <text x="50" y="1045" class="small">Linux app crash BLOCKED by platform; Windows variant: app, zone, DB and combined recovery PASS; DB full-phase availability FAIL. Lab retained.</text>

apiVersion: v1
kind: Namespace
metadata:
  name: csl
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: csl
  annotations:
    azure.workload.identity/client-id: "__RUNTIME_CLIENT_ID__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: csl
spec:
  replicas: 6
  selector:
    matchLabels:
      app: csl-api
  template:
    metadata:
      labels:
        app: csl-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: api
      nodeSelector:
        workload: csl-api
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: csl-api
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: csl-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: csl-api
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: "__IMAGE_DIGEST__"
          ports:
            - containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          env:
            - name: ASPNETCORE_URLS
              value: https://+:8443
            - name: ASPNETCORE_Kestrel__Certificates__Default__Path
              value: /tls/server.pfx
            - name: ConnectionStrings__Postgres
              value: "Host=__POSTGRES_HOST__;Database=csl;Username=id-csl-runtime"
            - name: Diagnostics__Token
              valueFrom:
                secretKeyRef:
                  name: api-auth
                  key: token
            - name: WEBSITE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: LAB_SOURCE_REVISION
              value: "__SOURCE_REVISION__"
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /health/live
              port: 8443
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /health/live
              port: 8443
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /health/live
              port: 8443
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: api-tls
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: csl
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-ipv4: "10.91.3.240"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-interval: "5"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-num-of-probe: "2"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: csl-api
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: csl
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app: csl-api
